    <text x="66" y="82" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="950" fill="#ffffff">ROUND OF 32</text>
    <text x="340" y="82" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="850" fill="#bfdbfe">KNOCKOUT</text>
