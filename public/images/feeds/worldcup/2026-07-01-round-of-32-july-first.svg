<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">世界杯32强战 7月1日赛程</title>
  <desc id="desc">美国、墨西哥、英格兰和比利时同日出战的世界杯32强赛程海报</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2a5f"/><stop offset="0.52" stop-color="#1e62d7"/><stop offset="1" stop-color="#17b37b"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#06152f" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="240" fill="#ffffff" opacity="0.08"/>
  <circle cx="970" cy="650" r="330" fill="#052f46" opacity="0.16"/>
  <rect x="24" y="24" rx="20" width="136" height="44" fill="#eaf2ff" opacity="0.96"/>
  <text x="46" y="53" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="900" fill="#1d4ed8">Feeds Hub</text>
  <g transform="translate(58 122)">
