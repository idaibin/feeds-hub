    <text x="0" y="112" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="70" font-weight="950" fill="#ffffff">7月1日</text>
    <text x="0" y="190" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="64" font-weight="950" fill="#ffffff">淘汰赛提速</text>
    <text x="0" y="258" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="850" fill="#dbeafe">四场32强战 · 主队与欧洲强队同日亮相</text>
  </g>
  <g transform="translate(660 112)" filter="url(#shadow)">
