<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="塞内加尔对阵比利时淘汰赛前瞻">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="0.52" stop-color="#166534"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#064e3b" stop-opacity="0.88"/>
    </linearGradient>
    <style>
      .brand{font:800 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#064e3b}
      .badge{font:800 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#ecfdf5}
      .title{font:950 48px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#0f172a}
      .sub{font:750 24px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#334155}
      .meta{font:800 19px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#047857}
      .label{font:900 30px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#ecfdf5}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1020" cy="580" r="330" fill="#ffffff" opacity="0.9"/>
  <circle cx="930" cy="200" r="260" fill="#ffffff" opacity="0.78"/>
  <rect x="16" y="16" width="150" height="36" rx="18" fill="#ecfdf5" opacity="0.94"/>
  <text x="43" y="40" class="brand">Feeds Hub</text>
  <rect x="980" y="16" width="284" height="36" rx="18" fill="#064e3b" opacity="0.84"/>
  <text x="1122" y="40" text-anchor="middle" class="badge">世界杯 · 32强赛</text>

  <g transform="translate(64 122)">
    <rect x="0" y="0" width="610" height="470" rx="54" fill="url(#field)"/>
    <path d="M305 22 L305 448" stroke="#bbf7d0" stroke-width="4" opacity="0.42"/>
    <rect x="38" y="46" width="534" height="378" rx="34" fill="none" stroke="#bbf7d0" stroke-width="5" opacity="0.42"/>
    <circle cx="305" cy="235" r="86" fill="none" stroke="#bbf7d0" stroke-width="5" opacity="0.42"/>
    <rect x="72" y="124" width="116" height="222" rx="28" fill="#ffffff" opacity="0.13"/>
    <rect x="422" y="124" width="116" height="222" rx="28" fill="#ffffff" opacity="0.13"/>
    <circle cx="305" cy="235" r="46" fill="#f8fafc"/>
    <path d="M305 189 L349 220 L332 272 L278 272 L261 220Z" fill="#0f172a" opacity="0.9"/>
    <path d="M178 122 C226 82 394 82 442 122" fill="none" stroke="#fde68a" stroke-width="16" stroke-linecap="round" opacity="0.78"/>
    <path d="M176 348 C240 398 370 398 434 348" fill="none" stroke="#fecaca" stroke-width="16" stroke-linecap="round" opacity="0.78"/>
    <rect x="96" y="38" width="130" height="56" rx="28" fill="#10b981" opacity="0.92"/>
    <text x="161" y="76" text-anchor="middle" class="label">SEN</text>
    <rect x="384" y="38" width="130" height="56" rx="28" fill="#f59e0b" opacity="0.92"/>
    <text x="449" y="76" text-anchor="middle" class="label">BEL</text>
  </g>

  <g transform="translate(748 184)">
    <text x="0" y="0" class="meta">Reuters · 2026-07-01</text>
    <text x="0" y="82" class="title">塞内加尔把</text>
    <text x="0" y="142" class="title">淘汰赛视为重新开局</text>
    <text x="0" y="198" class="sub">压线晋级后，对阵比利时成为</text>
