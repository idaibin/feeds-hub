    <rect x="0" y="288" width="132" height="42" rx="21" fill="#dcfce7"/>
    <text x="66" y="316" text-anchor="middle" class="meta">淘汰赛</text>
    <rect x="152" y="288" width="132" height="42" rx="21" fill="#dbeafe"/>
    <text x="218" y="316" text-anchor="middle" class="meta">32强</text>
