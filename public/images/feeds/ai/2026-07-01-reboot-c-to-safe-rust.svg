<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">C 到 Safe Rust 自动迁移研究</title>
  <desc id="desc">Reboot 论文提出将解释器从 C 迁移到 Safe Rust 的自动化流程海报</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="0.55" stop-color="#0f766e"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#020617" flood-opacity="0.30"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1030" cy="160" r="260" fill="#ffffff" opacity="0.08"/>
  <circle cx="900" cy="620" r="360" fill="#020617" opacity="0.16"/>
  <rect x="24" y="24" rx="20" width="136" height="44" fill="#eaf2ff" opacity="0.96"/>
  <text x="46" y="53" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="900" fill="#1d4ed8">Feeds Hub</text>
  <g transform="translate(58 122)">
    <text x="0" y="38" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="900" fill="#fed7aa">开源 · Rust工程</text>
    <text x="0" y="118" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="72" font-weight="950" fill="#ffffff">C → Safe Rust</text>
    <text x="0" y="196" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="64" font-weight="950" fill="#ffffff">迁移自动化</text>
    <text x="0" y="262" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="850" fill="#ffedd5">解释器重写 · 测试驱动 · 多智能体反馈</text>
  </g>
  <g transform="translate(685 112)" filter="url(#shadow)">
    <rect x="0" y="0" width="512" height="470" rx="42" fill="#ffffff" opacity="0.13" stroke="#ffffff" stroke-opacity="0.30"/>
    <g transform="translate(58 66)" font-family="Inter, JetBrains Mono, PingFang SC, Microsoft YaHei, sans-serif" font-weight="900">
      <rect x="0" y="0" width="168" height="130" rx="28" fill="#0f172a" opacity="0.72"/>
      <text x="58" y="78" font-size="54" fill="#ffffff">C</text>
      <path d="M210 66H310" stroke="#fed7aa" stroke-width="16" stroke-linecap="round"/>
      <path d="M292 36l42 30-42 30" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="340" y="0" width="168" height="130" rx="28" fill="#ea580c" opacity="0.92"/>
      <text x="370" y="78" font-size="48" fill="#ffffff">Rust</text>
      <g transform="translate(0 190)">
        <rect x="0" y="0" width="440" height="54" rx="18" fill="#ffffff" opacity="0.18"/>
        <text x="24" y="36" font-size="22" fill="#ffffff">tests: 100% provided suite</text>
        <rect x="0" y="78" width="390" height="54" rx="18" fill="#ffffff" opacity="0.18"/>
        <text x="24" y="114" font-size="22" fill="#ffffff">unsafe surface ↓</text>
        <rect x="0" y="156" width="470" height="54" rx="18" fill="#ffffff" opacity="0.18"/>
        <text x="24" y="192" font-size="22" fill="#ffffff">feature milestones + validation</text>
      </g>
    </g>
  </g>
</svg>
