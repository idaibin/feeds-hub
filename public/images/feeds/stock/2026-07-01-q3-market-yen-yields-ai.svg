    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1090" cy="112" r="260" fill="#2563eb" opacity="0.10"/>
  <circle cx="150" cy="650" r="250" fill="#22c55e" opacity="0.10"/>
