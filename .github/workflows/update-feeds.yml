name: Update feeds

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-feeds:
    name: Fetch, review and publish feeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Update feeds
        run: npm run update:feeds

      - name: Build check
        run: npm run build

      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No feed updates."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/feeds public/images/feeds docs/progress.md
          git commit -m "chore: update feeds"
          git push
